name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de incremento de version
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    name: Bump version (${{ inputs.bump }})
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Subir version
        id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          sed -i "s/^version: .*/version: ${version}/" src/manifest.yml
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Commit y tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/manifest.yml
          git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.version.outputs.tag }}"

  build:
    name: Build
    needs: bump
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump.outputs.tag }}

  release:
    name: GitHub Release
    needs: [bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: proxyxt-*
          path: artifacts
          merge-multiple: true

      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          gh release create "$TAG" artifacts/*.zip \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes
