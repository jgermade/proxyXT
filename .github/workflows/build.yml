name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref (rama, tag o SHA) a compilar
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:${{ matrix.target }}

      - name: Empaquetar zip
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          file="proxyxt-${{ matrix.target }}-v${version}.zip"
          (cd "build/${{ matrix.target }}" && zip -r -X "../../${file}" .)
          echo "file=${file}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: proxyxt-${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
